- type: entity
  parent: [BaseWeaponBatterySmall, BaseSecurityContraband]
  id: PistolDominator
  name: доминатор
  description: Высокотехнологичное оружие созданное правоохранительной организацией Sibyl System, предназначенное специально для борьбы с преступностью. Имеет два режима стрельбы, перед использованием необходимо предварительно привязать его к ID карте и иметь её при себе для стрельбы.
  suffix: Пистолет
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Battery/dominator.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Battery/dominator.rsi
  - type: Gun
    fireRate: 1.75
    soundGunshot:
      path: /Audio/_DeadSpace/Weapons/Guns/Gunshots/dominator.ogg
      params:
        volume: -2
  - type: BatteryAmmoProvider
    proto: X01Attack
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: X01Attack
      fireCost: 100
    - proto: BulletDisabler
      fireCost: 75
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: Tag
    tags:
    - Sidearm
    - LaserWeapon
  - type: StaticPrice
    price: 750
