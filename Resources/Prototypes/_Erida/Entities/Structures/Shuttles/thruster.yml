- type: entity
  id: OmniThrusterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: омни-двигатель
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: OmniThruster
    requirements: # Frontier
      Capacitor: 7 # Frontier
    stackRequirements:
      # Manipulator: 4 # Frontier
      Steel: 8

- type: entity
  id: OmniThruster
  name: омни-двигатель
  parent: [BaseThruster, ConstructibleMachine]
  components:
  - type: Sprite
    sprite: _Erida/Structures/Shuttles/omni_thruster.rsi
    offset: 0,0
    layers:
    - state: base_luatech
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_luatech
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0,1.5
  - type: Machine
    board: ThrusterMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: Thruster
    thrusterType: Omnidirectional
    baseThrust: 800
    thrust: 800
    thrustPerPartLevel: [600, 700, 800, 900, 1000]
    burnShape: ["-0.8,1.2","0,2.0","0.8,1.2","1.3,0.5"]
    damage:
      types:
        Heat: 120
  - type: Anchorable
    flags: None
  - type: StaticPrice
    price: 1500

